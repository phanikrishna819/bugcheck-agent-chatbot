server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://bugcheck-agent-api.onrender.com;
        # Render routes by Host/SNI: forwarding the frontend's own Host made
        # the upstream return 502, so pin both to the backend service.
        proxy_set_header Host bugcheck-agent-api.onrender.com;
        proxy_ssl_server_name on;
        proxy_ssl_name bugcheck-agent-api.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        # Agent turns can exceed nginx's 60s default while tools run / a
        # free-tier instance cold-starts.
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
